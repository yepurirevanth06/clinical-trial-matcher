name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ctm
          POSTGRES_PASSWORD: ctm
          POSTGRES_DB: ctm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests scripts

      - name: Type check
        run: mypy app --ignore-missing-imports

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://ctm:ctm@localhost:5432/ctm_test
          # Service containers map to localhost on the runner, not to their
          # service name -- pytest runs on the runner itself, not in a container.
          REDIS_URL: redis://localhost:6379/0
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ctm:${{ github.sha }} .
