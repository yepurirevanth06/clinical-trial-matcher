[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Query/Depends/Body/Path are meant to be called in argument
# defaults — that's how the framework reads parameter metadata. B008's
# mutable-default warning doesn't apply to them.
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Depends",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Header",
]
